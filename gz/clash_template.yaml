    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

rules:
  - RULE-SET,reject,广告拦截
  - DOMAIN-KEYWORD,openai,AI服务
  - DOMAIN-KEYWORD,anthropic,AI服务
  - DOMAIN-KEYWORD,claude,AI服务
  - DOMAIN-SUFFIX,chatgpt.com,AI服务
  - DOMAIN-SUFFIX,oaistatic.com,AI服务
  - DOMAIN-SUFFIX,oaiusercontent.com,AI服务
  - DOMAIN-SUFFIX,gemini.google.com,AI服务
  - DOMAIN-SUFFIX,copilot.microsoft.com,AI服务
  - DOMAIN-SUFFIX,youtube.com,国外媒体
  - DOMAIN-SUFFIX,googlevideo.com,国外媒体
  - DOMAIN-SUFFIX,netflix.com,国外媒体
  - DOMAIN-SUFFIX,netflix.net,国外媒体
  - DOMAIN-SUFFIX,nflximg.net,国外媒体
  - DOMAIN-SUFFIX,nflxvideo.net,国外媒体
  - DOMAIN-SUFFIX,spotify.com,国外媒体
  - DOMAIN-SUFFIX,disneyplus.com,国外媒体
  - RULE-SET,telegramcidr,电报消息,no-resolve
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - DOMAIN-SUFFIX,microsoft.com,微软服务
  - DOMAIN-SUFFIX,live.com,微软服务
  - DOMAIN-SUFFIX,office.com,微软服务
  - RULE-SET,google,节点选择
  - RULE-SET,proxy,节点选择
  - RULE-SET,direct,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve
  - RULE-SET,cncidr,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,漏网之鱼
