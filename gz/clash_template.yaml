port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: silent
ipv6: false
unified-delay: true
tcp-concurrent: true

find-process-mode: strict
global-client-fingerprint: chrome
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.apple.com"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

proxies:
{{PROXIES}}

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "自动优选"
      - "故障转移"
      - "负载均衡"
      - "香港优选"
      - "台湾优选"
      - "日本优选"
      - "新加坡优选"
      - "美国优选"
{{TAGS}}
      - DIRECT

  - name: "自动优选"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    lazy: false
    proxies:
{{TAGS}}

  - name: "故障转移"
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 120
    lazy: false
    proxies:
{{TAGS}}

  - name: "负载均衡"
    type: load-balance
    strategy: round-robin
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    lazy: false
    proxies:
{{TAGS}}

  - name: "AI服务"
    type: select
    proxies:
      - "节点选择"
      - "美国优选"
      - "日本优选"
      - "新加坡优选"
      - "台湾优选"

  - name: "国外媒体"
    type: select
    proxies:
      - "节点选择"
      - "自动优选"
      - "香港优选"
      - "台湾优选"
      - "日本优选"
      - "新加坡优选"
      - "美国优选"

  - name: "微软服务"
    type: select
    proxies:
      - DIRECT
      - "节点选择"
      - "自动优选"

  - name: "电报消息"
    type: select
    proxies:
      - "节点选择"
      - "新加坡优选"
      - "香港优选"
      - "自动优选"

  - name: "广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "漏网之鱼"
    type: select
    proxies:
      - "节点选择"
      - "自动优选"
      - DIRECT

  - name: "香港优选"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    filter: "(?i)港|hk|hongkong|hong kong"
    proxies:
{{TAGS}}

  - name: "台湾优选"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    filter: "(?i)台|tw|taiwan"
    proxies:
{{TAGS}}

  - name: "日本优选"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    filter: "(?i)日|jp|japan"
    proxies:
{{TAGS}}

  - name: "新加坡优选"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    filter: "(?i)新|sg|singapore"
    proxies:
{{TAGS}}

  - name: "美国优选"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    filter: "(?i)美|us|unitedstates|united states"
    proxies:
{{TAGS}}

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
